<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>
  <meta name="description" content="Catálogo de productos. Escríbenos por WhatsApp para pedir el tuyo.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="hero">
    <div class="wrap">
      <h1 id="nombreNegocio">Mi Negocio</h1>
      <p id="eslogan">Mira nuestros productos y pídelos por WhatsApp</p>
      <a id="btnContacto" class="btn btn-wa" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    </div>
  </header>

  <main class="wrap">
    <div class="filtros">
      <input id="buscar" type="search" placeholder="Buscar producto...">
      <select id="categoria"><option value="">Todas las categorías</option></select>
    </div>

    <p id="vacio" class="vacio" hidden>No encontramos productos con esa búsqueda.</p>
    <section id="grid" class="grid"></section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p id="pie"></p>
    </div>
  </footer>

  <a id="flotante" class="flotante" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.4.7 4.7 1.9 6.600L3 29l7.100-2.200c1.800 1 3.800 1.500 5.900 1.500 6.900 0 12.600-5.600 12.600-12.500S22.900 3 16 3zm0 22.700c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.200 1.300 1.400-4-.3-.4a10 10 0 0 1-1.600-5.400C5.600 10 10.300 5.400 16 5.400S26.400 10 26.400 15.600 21.700 25.700 16 25.700zm5.600-7.500c-.3-.2-1.800-.9-2.100-1-.3-.1-.5-.2-.7.200s-.8 1-1 1.200c-.2.200-.4.200-.7.100-.3-.2-1.300-.5-2.400-1.500-.9-.8-1.500-1.800-1.700-2.100-.2-.3 0-.5.100-.6l.5-.5c.1-.2.200-.3.300-.5.100-.2.100-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400s-1 1-1 2.400 1 2.800 1.200 3c.1.200 2 3.100 4.900 4.300.7.3 1.200.5 1.600.6.7.2 1.300.2 1.800.1.600-.1 1.800-.7 2-1.400.3-.7.300-1.300.2-1.400-.1-.1-.3-.2-.6-.4z"/></svg>
  </a>

  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
